name: Deploy Demo Video VOD

on:
  workflow_dispatch:
    inputs:
      stack_name:
        description: Exact dedicated VOD CloudFormation stack name
        required: true
        default: kosa-governance-demo-video
        type: string
      environment:
        description: Protected customer deployment Environment
        required: true
        default: customer-sandbox-deploy
        type: environment
      aws_region:
        description: AWS Region for S3, Lambda, MediaConvert, and EventBridge
        required: true
        default: us-east-1
        type: string
      role_to_assume:
        description: Customer-approved GitHub Actions OIDC deployment role ARN
        required: true
        type: string
      cloudformation_execution_role_arn:
        description: Customer CloudFormation execution role ARN
        required: true
        type: string
      notification_email:
        description: Optional MediaConvert COMPLETE/ERROR email recipient
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      STACK_NAME: ${{ inputs.stack_name }}
      ROLE_TO_ASSUME: ${{ inputs.role_to_assume }}
      EXECUTION_ROLE_ARN: ${{ inputs.cloudformation_execution_role_arn }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
    steps:
      - name: Check out approved repository revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate exact deployment boundary
        run: |
          set -euo pipefail
          test "${STACK_NAME}" = "kosa-governance-demo-video"
          [[ "${EXPECTED_AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${ROLE_TO_ASSUME}" =~ ^arn:[^:]+:iam::${EXPECTED_AWS_ACCOUNT_ID}:role/.+$ ]]
          [[ "${EXECUTION_ROLE_ARN}" =~ ^arn:[^:]+:iam::${EXPECTED_AWS_ACCOUNT_ID}:role/.+$ ]]

      - name: Configure customer deployment credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.role_to_assume }}
          role-session-name: demo-video-vod-deploy
          allowed-account-ids: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Deploy dedicated VOD stack
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "${EXPECTED_AWS_ACCOUNT_ID}"
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/demo-video-vod.yaml \
            --stack-name "${STACK_NAME}" \
            --role-arn "${EXECUTION_ROLE_ARN}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              ProjectName=kosa-governance \
              Environment=sandbox \
              "NotificationEmail=${{ inputs.notification_email }}" \
            --no-fail-on-empty-changeset

      - name: Publish the HLS player
        id: publish
        run: |
          set -euo pipefail
          output_bucket=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Outputs[?OutputKey==`OutputBucketName`].OutputValue' --output text)
          distribution_id=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue' --output text)
          player_url=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Outputs[?OutputKey==`PlayerUrl`].OutputValue' --output text)
          source_bucket=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].Outputs[?OutputKey==`SourceBucketName`].OutputValue' --output text)
          aws s3 cp demo/video-player/index.html "s3://${output_bucket}/index.html" \
            --content-type text/html --cache-control 'no-cache,no-store,must-revalidate'
          invalidation_id=$(aws cloudfront create-invalidation --distribution-id "${distribution_id}" \
            --paths '/index.html' --query Invalidation.Id --output text)
          {
            echo "### Demo VOD deployment"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Source upload: \`s3://${source_bucket}/source/GovLens.mp4\`"
            echo "- Player: ${player_url}"
            echo "- CloudFront invalidation: \`${invalidation_id}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
