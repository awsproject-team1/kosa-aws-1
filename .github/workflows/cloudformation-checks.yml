name: CloudFormation Checks

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "infrastructure/cloudformation/**"
      - "infrastructure/parameters/**"
      - "tests/security/test_cloudformation_security.py"
      - ".github/workflows/deploy-m0-foundation.yml"
      - ".github/workflows/m0-lambda-package.yml"
      - "scripts/package-m0-lambda.sh"
      - "requirements-dev.txt"
      - "requirements-dev.lock.txt"
      - ".github/workflows/cloudformation-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt

      - name: Install locked CloudFormation validation dependencies
        run: >-
          python -m pip install --require-hashes
          --requirement requirements-dev.lock.txt

      - name: Lint customer deployment templates
        run: >-
          cfn-lint --non-zero-exit-code error
          infrastructure/cloudformation/m0-foundation.yaml
          infrastructure/cloudformation/m1-customer-bootstrap.yaml

      - name: Verify CloudFormation security controls
        run: >-
          python -m unittest discover
          --start-directory tests/security
          --pattern "test_cloudformation_security.py"
          --verbose
