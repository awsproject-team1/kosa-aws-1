name: M0 Lambda Package

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/**"
      - "packages/**"
      - "fixtures/m0/**"
      - "scripts/package-m0-lambda.sh"
      - ".gitattributes"
      - ".github/workflows/m0-lambda-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-m0-lambda:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build and verify deterministic Lambda ZIP
        run: |
          set -euo pipefail
          bash scripts/package-m0-lambda.sh "${RUNNER_TEMP}/m0-lambda-first.zip"
          bash scripts/package-m0-lambda.sh "${RUNNER_TEMP}/m0-lambda-second.zip"
          cmp -- "${RUNNER_TEMP}/m0-lambda-first.zip" "${RUNNER_TEMP}/m0-lambda-second.zip"
          sha256sum "${RUNNER_TEMP}/m0-lambda-first.zip"
