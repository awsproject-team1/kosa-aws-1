name: Deploy M0 Foundation

on:
  workflow_dispatch:
    inputs:
      stack_name:
        description: CloudFormation stack name
        required: true
        type: string
      project_name:
        description: ProjectName CloudFormation parameter
        required: true
        type: string
      environment:
        description: Protected GitHub Environment for artifact preparation
        required: true
        type: environment
      stack_environment:
        description: Short CloudFormation Environment parameter, for example sandbox
        required: true
        default: sandbox
        type: string
      artifact_approval_environment:
        description: Separate protected Environment for approving the exact Lambda artifact binding
        required: true
        type: environment
      aws_region:
        description: Customer deployment region
        required: true
        default: us-east-1
        type: string
      role_to_assume:
        description: Customer-approved GitHub Actions OIDC deployment role ARN
        required: true
        type: string
      cloudformation_execution_role_arn:
        description: Customer bootstrap FoundationExecutionRole ARN passed only to CloudFormation
        required: true
        type: string
      lambda_code_s3_bucket:
        description: Versioned customer-owned bucket for the Lambda ZIP
        required: true
        type: string
      assessment_scope_json:
        description: Approved customer/repository selector map, with the console connection facts
        required: true
        default: '{}'
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  prepare-artifact:
    runs-on: ubuntu-latest
    # This Environment gates the first AWS write and must define EXPECTED_AWS_ACCOUNT_ID.
    environment: ${{ inputs.environment }}
    outputs:
      lambda_code_s3_key: ${{ steps.bind-artifact.outputs.lambda_code_s3_key }}
      lambda_code_s3_object_version: ${{ steps.bind-artifact.outputs.lambda_code_s3_object_version }}
      lambda_zip_sha256: ${{ steps.bind-artifact.outputs.lambda_zip_sha256 }}
      langgraph_layer_s3_key: ${{ steps.bind-layer.outputs.langgraph_layer_s3_key }}
      langgraph_layer_s3_object_version: ${{ steps.bind-layer.outputs.langgraph_layer_s3_object_version }}
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
      ARTIFACT_APPROVAL_ENVIRONMENT: ${{ inputs.artifact_approval_environment }}
      ROLE_TO_ASSUME: ${{ inputs.role_to_assume }}
      LAMBDA_CODE_S3_BUCKET: ${{ inputs.lambda_code_s3_bucket }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build and verify the Lambda ZIP
        run: bash scripts/package-m0-lambda.sh "${RUNNER_TEMP}/m0-lambda.zip"

      - name: Build and verify the LangGraph Layer ZIP
        run: bash scripts/build-langgraph-layer.sh "${RUNNER_TEMP}/langgraph-layer.zip"

      - name: Validate protected artifact inputs
        run: |
          set -euo pipefail
          [[ "${EXPECTED_AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${ROLE_TO_ASSUME}" =~ ^arn:[^:]+:iam::${EXPECTED_AWS_ACCOUNT_ID}:role/.+$ ]]
          test "${ARTIFACT_APPROVAL_ENVIRONMENT}" != "${DEPLOYMENT_ENVIRONMENT}"

      - name: Configure customer artifact credentials
        # v6.2.3
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.role_to_assume }}
          role-session-name: m0-artifact-prepare
          allowed-account-ids: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Verify artifact account and bucket
        run: |
          set -euo pipefail
          actual_account_id=$(aws sts get-caller-identity --query Account --output text)
          test "${actual_account_id}" = "${EXPECTED_AWS_ACCOUNT_ID}"
          versioning_status=$(
            aws s3api get-bucket-versioning \
              --bucket "${LAMBDA_CODE_S3_BUCKET}" \
              --expected-bucket-owner "${EXPECTED_AWS_ACCOUNT_ID}" \
              --query Status \
              --output text
          )
          test "${versioning_status}" = "Enabled"

      - name: Create or verify immutable Lambda artifact
        id: bind-artifact
        env:
          LAMBDA_CODE_S3_KEY: lambda/m0/${{ github.sha }}.zip
        run: |
          set -euo pipefail

          zip_sha256_hex=$(sha256sum "${RUNNER_TEMP}/m0-lambda.zip" | cut -d ' ' -f1)
          zip_sha256_base64=$(openssl dgst -sha256 -binary "${RUNNER_TEMP}/m0-lambda.zip" | base64)
          put_error="${RUNNER_TEMP}/put-object.error"

          set +e
          upload_response=$(
            aws s3api put-object \
              --bucket "${LAMBDA_CODE_S3_BUCKET}" \
              --key "${LAMBDA_CODE_S3_KEY}" \
              --body "${RUNNER_TEMP}/m0-lambda.zip" \
              --if-none-match "*" \
              --expected-bucket-owner "${EXPECTED_AWS_ACCOUNT_ID}" \
              --checksum-algorithm SHA256 \
              --checksum-sha256 "${zip_sha256_base64}" \
              --metadata "commit-sha=${GITHUB_SHA},zip-sha256=${zip_sha256_hex}" \
              --output json \
              2> "${put_error}"
          )
          upload_status=$?
          set -e

          if (( upload_status == 0 )); then
            artifact_response="${upload_response}"
            artifact_disposition="created"
            recorded_commit_sha="${GITHUB_SHA}"
            recorded_zip_sha256="${zip_sha256_hex}"
          else
            if ! artifact_response=$(
              aws s3api head-object \
                --bucket "${LAMBDA_CODE_S3_BUCKET}" \
                --key "${LAMBDA_CODE_S3_KEY}" \
                --expected-bucket-owner "${EXPECTED_AWS_ACCOUNT_ID}" \
                --checksum-mode ENABLED \
                --output json
            ); then
              cat "${put_error}" >&2
              exit "${upload_status}"
            fi
            artifact_disposition="verified existing"
            recorded_commit_sha=$(jq -r '.Metadata["commit-sha"] // empty' <<< "${artifact_response}")
            recorded_zip_sha256=$(jq -r '.Metadata["zip-sha256"] // empty' <<< "${artifact_response}")
          fi

          object_version=$(jq -r '.VersionId // empty' <<< "${artifact_response}")
          returned_checksum=$(jq -r '.ChecksumSHA256 // empty' <<< "${artifact_response}")
          test -n "${object_version}"
          test "${returned_checksum}" = "${zip_sha256_base64}"
          test "${recorded_commit_sha}" = "${GITHUB_SHA}"
          test "${recorded_zip_sha256}" = "${zip_sha256_hex}"

          echo "lambda_code_s3_key=${LAMBDA_CODE_S3_KEY}" >> "${GITHUB_OUTPUT}"
          echo "lambda_code_s3_object_version=${object_version}" >> "${GITHUB_OUTPUT}"
          echo "lambda_zip_sha256=${zip_sha256_hex}" >> "${GITHUB_OUTPUT}"
          {
            echo "### M0 Lambda artifact awaiting deployment approval"
            echo "- Disposition: ${artifact_disposition}"
            echo "- Commit SHA: \`${GITHUB_SHA}\`"
            echo "- Object key: \`${LAMBDA_CODE_S3_KEY}\`"
            echo "- S3 Version ID: \`${object_version}\`"
            echo "- ZIP SHA-256: \`${zip_sha256_hex}\`"
            echo "- AWS account boundary: matched artifact-preparation Environment"
            echo "- Next gate: approve the separate artifact deployment Environment only after reviewing these values"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create or verify immutable LangGraph Layer artifact
        id: bind-layer
        run: |
          set -euo pipefail

          layer_sha256_hex=$(sha256sum "${RUNNER_TEMP}/langgraph-layer.zip" | cut -d ' ' -f1)
          layer_sha256_base64=$(openssl dgst -sha256 -binary "${RUNNER_TEMP}/langgraph-layer.zip" | base64)
          # Content-addressed key: identical dependency sets reuse the same object.
          layer_key="lambda/m0/langgraph-layer-${layer_sha256_hex}.zip"
          put_error="${RUNNER_TEMP}/put-layer.error"

          set +e
          upload_response=$(
            aws s3api put-object \
              --bucket "${LAMBDA_CODE_S3_BUCKET}" \
              --key "${layer_key}" \
              --body "${RUNNER_TEMP}/langgraph-layer.zip" \
              --if-none-match "*" \
              --expected-bucket-owner "${EXPECTED_AWS_ACCOUNT_ID}" \
              --checksum-algorithm SHA256 \
              --checksum-sha256 "${layer_sha256_base64}" \
              --metadata "layer-sha256=${layer_sha256_hex}" \
              --output json \
              2> "${put_error}"
          )
          upload_status=$?
          set -e

          if (( upload_status == 0 )); then
            layer_response="${upload_response}"
            layer_disposition="created"
          else
            if ! layer_response=$(
              aws s3api head-object \
                --bucket "${LAMBDA_CODE_S3_BUCKET}" \
                --key "${layer_key}" \
                --expected-bucket-owner "${EXPECTED_AWS_ACCOUNT_ID}" \
                --checksum-mode ENABLED \
                --output json
            ); then
              cat "${put_error}" >&2
              exit "${upload_status}"
            fi
            layer_disposition="verified existing"
          fi

          layer_version=$(jq -r '.VersionId // empty' <<< "${layer_response}")
          test -n "${layer_version}"

          echo "langgraph_layer_s3_key=${layer_key}" >> "${GITHUB_OUTPUT}"
          echo "langgraph_layer_s3_object_version=${layer_version}" >> "${GITHUB_OUTPUT}"
          {
            echo "### LangGraph Layer artifact awaiting deployment approval"
            echo "- Disposition: ${layer_disposition}"
            echo "- Object key: \`${layer_key}\`"
            echo "- S3 Version ID: \`${layer_version}\`"
            echo "- Layer SHA-256: \`${layer_sha256_hex}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    needs: prepare-artifact
    runs-on: ubuntu-latest
    # This distinct Environment creates a second human gate after artifact evidence exists.
    environment: ${{ inputs.artifact_approval_environment }}
    env:
      STACK_NAME: ${{ inputs.stack_name }}
      PROJECT_NAME: ${{ inputs.project_name }}
      STACK_ENVIRONMENT: ${{ inputs.stack_environment }}
      AWS_REGION: ${{ inputs.aws_region }}
      ROLE_TO_ASSUME: ${{ inputs.role_to_assume }}
      CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ inputs.cloudformation_execution_role_arn }}
      LAMBDA_CODE_S3_BUCKET: ${{ inputs.lambda_code_s3_bucket }}
      LAMBDA_CODE_S3_KEY: ${{ needs.prepare-artifact.outputs.lambda_code_s3_key }}
      LAMBDA_CODE_S3_OBJECT_VERSION: ${{ needs.prepare-artifact.outputs.lambda_code_s3_object_version }}
      LAMBDA_ZIP_SHA256: ${{ needs.prepare-artifact.outputs.lambda_zip_sha256 }}
      LANGGRAPH_LAYER_S3_KEY: ${{ needs.prepare-artifact.outputs.langgraph_layer_s3_key }}
      LANGGRAPH_LAYER_S3_OBJECT_VERSION: ${{ needs.prepare-artifact.outputs.langgraph_layer_s3_object_version }}
      ASSESSMENT_SCOPE_JSON: ${{ inputs.assessment_scope_json }}
      M1_ASSESSMENT_MODE: ${{ vars.M1_ASSESSMENT_MODE }}
      M1_ASSESSMENT_RUNTIME_JSON: ${{ secrets.M1_ASSESSMENT_RUNTIME_JSON }}
      M1_ASSESSMENT_SECRET_ARNS: ${{ secrets.M1_ASSESSMENT_SECRET_ARNS }}
      M1_ASSESSMENT_READ_ROLE_ARNS: ${{ secrets.M1_ASSESSMENT_READ_ROLE_ARNS }}
      # 승인된 배포 대상과 그 GitHub token. 둘은 템플릿 Rule
      # `DeploymentCommitResolutionAllOrNone`이 all-or-none으로 강제하므로 같은 Environment에서
      # 함께 정의한다. 비어 있으면 TERRAFORM_PATCH의 PR write와 apply 대상 commit 해석이
      # fail-closed로 남는다(ADR-0019 §3·§4).
      DEPLOYMENT_RUNTIME_JSON: ${{ secrets.DEPLOYMENT_RUNTIME_JSON }}
      DEPLOYMENT_GITHUB_SECRET_ARNS: ${{ secrets.DEPLOYMENT_GITHUB_SECRET_ARNS }}
      # 승인된 POLICY_AUTHORING model profile. 비어 있으면 authoring worker의 Bedrock 권한이
      # 만들어지지 않아 정책 후보 추출이 설정 단계에서 멈춘다(ADR-0023).
      POLICY_AUTHORING_MODEL_PROFILE_JSON: ${{ vars.POLICY_AUTHORING_MODEL_PROFILE_JSON }}
      # Cognito Hosted UI 콜백. 기본값은 localhost이므로 배포된 SPA로 로그인하려면 지정해야 한다.
      FRONTEND_CALLBACK_URL: ${{ vars.FRONTEND_CALLBACK_URL }}
      FRONTEND_LOGOUT_URL: ${{ vars.FRONTEND_LOGOUT_URL }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
    steps:
      - name: Check out approved repository revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate protected deployment inputs
        run: |
          set -euo pipefail
          [[ "${EXPECTED_AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]
          [[ "${ROLE_TO_ASSUME}" =~ ^arn:[^:]+:iam::${EXPECTED_AWS_ACCOUNT_ID}:role/.+$ ]]
          [[ "${CLOUDFORMATION_EXECUTION_ROLE_ARN}" =~ ^arn:[^:]+:iam::${EXPECTED_AWS_ACCOUNT_ID}:role/.+$ ]]
          test -n "${LAMBDA_CODE_S3_KEY}"
          test -n "${LAMBDA_CODE_S3_OBJECT_VERSION}"
          [[ "${LAMBDA_ZIP_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test -n "${LANGGRAPH_LAYER_S3_KEY}"
          test -n "${LANGGRAPH_LAYER_S3_OBJECT_VERSION}"
          # 배포 대상과 그 token은 함께 있거나 함께 없어야 한다. 템플릿 Rule도 같은 것을
          # 강제하지만, 여기서 걸면 CloudFormation 호출 전에 이름을 밝히고 멈춘다.
          if [[ -n "${DEPLOYMENT_RUNTIME_JSON}" || -n "${DEPLOYMENT_GITHUB_SECRET_ARNS}" ]]; then
            test -n "${DEPLOYMENT_RUNTIME_JSON}" \
              || { echo "DEPLOYMENT_RUNTIME_JSON is required alongside DEPLOYMENT_GITHUB_SECRET_ARNS"; exit 1; }
            test -n "${DEPLOYMENT_GITHUB_SECRET_ARNS}" \
              || { echo "DEPLOYMENT_GITHUB_SECRET_ARNS is required alongside DEPLOYMENT_RUNTIME_JSON"; exit 1; }
          fi

      - name: Validate assessment deployment configuration
        run: python3 -m scripts.validate_m1_deployment_config

      - name: Configure customer deployment credentials
        # v6.2.3
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.role_to_assume }}
          role-session-name: m0-foundation-deploy
          allowed-account-ids: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Reverify approved account and artifact version
        run: |
          set -euo pipefail
          actual_account_id=$(aws sts get-caller-identity --query Account --output text)
          test "${actual_account_id}" = "${EXPECTED_AWS_ACCOUNT_ID}"
          artifact_response=$(
            aws s3api head-object \
              --bucket "${LAMBDA_CODE_S3_BUCKET}" \
              --key "${LAMBDA_CODE_S3_KEY}" \
              --version-id "${LAMBDA_CODE_S3_OBJECT_VERSION}" \
              --expected-bucket-owner "${EXPECTED_AWS_ACCOUNT_ID}" \
              --checksum-mode ENABLED \
              --output json
          )
          test "$(jq -r '.VersionId // empty' <<< "${artifact_response}")" = "${LAMBDA_CODE_S3_OBJECT_VERSION}"
          test "$(jq -r '.Metadata["commit-sha"] // empty' <<< "${artifact_response}")" = "${GITHUB_SHA}"
          test "$(jq -r '.Metadata["zip-sha256"] // empty' <<< "${artifact_response}")" = "${LAMBDA_ZIP_SHA256}"
          expected_checksum=$(printf '%s' "${LAMBDA_ZIP_SHA256}" | xxd -r -p | base64)
          test "$(jq -r '.ChecksumSHA256 // empty' <<< "${artifact_response}")" = "${expected_checksum}"

      - name: Deploy approved CloudFormation artifact
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --template-file infrastructure/cloudformation/m0-foundation.yaml \
            --stack-name "${STACK_NAME}" \
            --role-arn "${CLOUDFORMATION_EXECUTION_ROLE_ARN}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "ProjectName=${PROJECT_NAME}" \
              "Environment=${STACK_ENVIRONMENT}" \
              "LambdaCodeS3Bucket=${LAMBDA_CODE_S3_BUCKET}" \
              "LambdaCodeS3Key=${LAMBDA_CODE_S3_KEY}" \
              "LambdaCodeS3ObjectVersion=${LAMBDA_CODE_S3_OBJECT_VERSION}" \
              "LangGraphLayerS3Key=${LANGGRAPH_LAYER_S3_KEY}" \
              "LangGraphLayerS3ObjectVersion=${LANGGRAPH_LAYER_S3_OBJECT_VERSION}" \
              "AssessmentScopeJson=${ASSESSMENT_SCOPE_JSON}" \
              "M1AssessmentRuntimeJson=${M1_ASSESSMENT_RUNTIME_JSON}" \
              "M1AssessmentSecretArns=${M1_ASSESSMENT_SECRET_ARNS}" \
              "M1AssessmentReadRoleArns=${M1_ASSESSMENT_READ_ROLE_ARNS}" \
              "DeploymentRuntimeJson=${DEPLOYMENT_RUNTIME_JSON}" \
              "DeploymentGitHubSecretArns=${DEPLOYMENT_GITHUB_SECRET_ARNS}" \
              "PolicyAuthoringModelProfileJson=${POLICY_AUTHORING_MODEL_PROFILE_JSON}" \
              "FrontendCallbackUrl=${FRONTEND_CALLBACK_URL:-http://localhost:5173}" \
              "FrontendLogoutUrl=${FRONTEND_LOGOUT_URL:-http://localhost:5173}" \
            --no-fail-on-empty-changeset

      - name: Diagnose failed CloudFormation deployment
        if: failure()
        run: |
          set +e
          echo "::group::Recent failed change sets"
          aws cloudformation list-change-sets \
            --stack-name "${STACK_NAME}" \
            --query 'Summaries[?Status==`FAILED`]|reverse(sort_by(@, &CreationTime))[:3].{Name:ChangeSetName,Created:CreationTime,Reason:StatusReason}' \
            --output json
          echo "::endgroup::"
          failed_change_set_id=$(aws cloudformation list-change-sets \
            --stack-name "${STACK_NAME}" \
            --query 'reverse(sort_by(Summaries[?Status==`FAILED`], &CreationTime))[0].ChangeSetId' \
            --output text)
          if [[ -n "${failed_change_set_id}" && "${failed_change_set_id}" != "None" ]]; then
            echo "::group::Early validation failures"
            aws cloudformation describe-events \
              --stack-name "${STACK_NAME}" \
              --change-set-name "${failed_change_set_id}" \
              --filters FailedEvents=true \
              --query 'OperationEvents[].{LogicalResourceId:LogicalResourceId,ResourceType:ResourceType,ValidationName:ValidationName,ValidationPath:ValidationPath,ValidationStatusReason:ValidationStatusReason,HookStatusReason:HookStatusReason,ResourceStatusReason:ResourceStatusReason}' \
              --output json
            echo "::endgroup::"
          fi
          echo "::group::Recent stack failures"
          aws cloudformation describe-stack-events \
            --stack-name "${STACK_NAME}" \
            --query 'StackEvents[?ResourceStatus==`CREATE_FAILED` || ResourceStatus==`UPDATE_FAILED`].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
            --output table
          echo "::endgroup::"
