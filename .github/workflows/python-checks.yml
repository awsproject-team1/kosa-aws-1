name: Python Checks

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "**/*.py"
      - "packages/contracts/**"
      - "tests/contract/**"
      - "fixtures/**"
      - "infrastructure/**"
      - "README.md"
      - "docs/**"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - "apps/backend/requirements.txt"
      - ".github/workflows/python-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            apps/backend/requirements.txt

      - name: Install development and Backend runtime dependencies
        run: >-
          python -m pip install
          --requirement requirements-dev.txt
          --requirement apps/backend/requirements.txt

      - name: Validate CloudFormation templates
        run: cfn-lint infrastructure/cloudformation/m0-foundation.json

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Run unit tests
        run: python -m unittest discover --start-directory tests/unit --pattern "test_*.py" --verbose

      - name: Run contract tests
        run: python -m unittest discover --start-directory tests/contract --pattern "test_*.py" --verbose

      - name: Run integration tests
        shell: bash
        run: |
          set -euo pipefail
          if ! find tests/integration -type f -name 'test_*.py' -print -quit | grep -q .; then
            echo "No integration tests are defined yet; skipping."
            exit 0
          fi
          python -m unittest discover --start-directory tests/integration --pattern "test_*.py" --verbose

      - name: Run security tests
        run: python -m unittest discover --start-directory tests/security --pattern "test_*.py" --verbose
