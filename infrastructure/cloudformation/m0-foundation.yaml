AWSTemplateFormatVersion: "2010-09-09"
Description: M0 customer-scoped metadata, artifact, audit, and asynchronous workflow foundation.

Parameters:
  ProjectName:
    Type: String
    MinLength: 2
    MaxLength: 31
    AllowedPattern: "^(?!xn--)(?!sthree-)(?!amzn-s3-demo-)[a-z](?:[a-z0-9-]*[a-z0-9])?$"
    ConstraintDescription: Use 2-31 lowercase letters, digits, and hyphens; start with a letter, end with a letter or digit, and avoid S3-reserved prefixes.
  Environment:
    Type: String
    MinLength: 2
    MaxLength: 8
    AllowedPattern: "^[a-z](?:[a-z0-9-]*[a-z0-9])?$"
    ConstraintDescription: Use 2-8 lowercase letters, digits, and hyphens; start with a letter and end with a letter or digit.
  LambdaCodeS3Bucket:
    Type: String
    MinLength: 3
    ConstraintDescription: Versioned deployment-artifact bucket containing the packaged Python ZIP.
  LambdaCodeS3Key:
    Type: String
    MinLength: 1
    ConstraintDescription: Object key for the packaged Python ZIP.
  LambdaCodeS3ObjectVersion:
    Type: String
    MinLength: 1
    ConstraintDescription: Immutable S3 Version ID returned by the approved Lambda ZIP upload.
  LangGraphLayerS3Key:
    Type: String
    MinLength: 1
    ConstraintDescription: Object key for the LangGraph dependency Layer ZIP.
  LangGraphLayerS3ObjectVersion:
    Type: String
    MinLength: 1
    ConstraintDescription: Immutable S3 Version ID returned by the approved LangGraph Layer upload.
  AssessmentScopeJson:
    Type: String
    Default: "{}"
    NoEcho: true
    ConstraintDescription: Customer-scoped approved repository/profile selector map for M0.
  M1AssessmentRuntimeJson:
    Type: String
    Default: ""
    NoEcho: true
    ConstraintDescription: Optional protected M1 customer/repository target configuration; empty preserves fixture mode.
  M1AssessmentSecretArns:
    Type: String
    Default: ""
    NoEcho: true
    AllowedPattern: '^$|^arn:[^:,]+:secretsmanager:[^:,]+:[0-9]{12}:secret:[^,]+(,arn:[^:,]+:secretsmanager:[^:,]+:[0-9]{12}:secret:[^,]+)*$'
    ConstraintDescription: Comma-separated non-empty Secrets Manager ARNs or empty for fixture mode.
  M1AssessmentReadRoleArns:
    Type: String
    Default: ""
    NoEcho: true
    AllowedPattern: '^$|^arn:[^:,]+:iam::[0-9]{12}:role/[^,]+(,arn:[^:,]+:iam::[0-9]{12}:role/[^,]+)*$'
    ConstraintDescription: Comma-separated non-empty IAM role ARNs or empty for fixture mode.
  DeploymentRuntimeJson:
    Type: String
    Default: ""
    NoEcho: true
    ConstraintDescription: Optional approved deployment target configuration; empty leaves the TERRAFORM_PATCH deployment path fail-closed.
  PolicyAuthoringModelProfileJson:
    Type: String
    Default: ""
    Description: >-
      Approved POLICY_AUTHORING model profile as JSON. Empty disables the authoring worker's
      Bedrock access: the candidate extraction path then fails closed at configuration rather
      than extracting with an unreviewed model or prompt.
  DeploymentGitHubSecretArns:
    Type: String
    Default: ""
    NoEcho: true
    AllowedPattern: '^$|^arn:[^:,]+:secretsmanager:[^:,]+:[0-9]{12}:secret:[^,]+(,arn:[^:,]+:secretsmanager:[^:,]+:[0-9]{12}:secret:[^,]+)*$'
    ConstraintDescription: Comma-separated non-empty Secrets Manager ARNs holding approved repository GitHub tokens, or empty.
  FrontendCallbackUrl:
    Type: String
    Default: http://localhost:5173
    ConstraintDescription: Exact HTTPS production or localhost OAuth callback URL for the Assessment SPA.
  FrontendLogoutUrl:
    Type: String
    Default: http://localhost:5173
    ConstraintDescription: Exact HTTPS production or localhost logout URL for the Assessment SPA.

Rules:
  M1AssessmentInputsAllOrNone:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::And:
                - Fn::Equals: [!Ref M1AssessmentRuntimeJson, ""]
                - Fn::Equals: [!Ref M1AssessmentSecretArns, ""]
                - Fn::Equals: [!Ref M1AssessmentReadRoleArns, ""]
            - Fn::And:
                - Fn::Not: [!Equals [!Ref M1AssessmentRuntimeJson, ""]]
                - Fn::Not: [!Equals [!Ref M1AssessmentSecretArns, ""]]
                - Fn::Not: [!Equals [!Ref M1AssessmentReadRoleArns, ""]]
        AssertDescription: >-
          M1 runtime JSON, secret ARNs, and read-role ARNs must be either all empty
          for fixture mode or all non-empty for live mode.
  DeploymentCommitResolutionAllOrNone:
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::And:
                - Fn::Equals: [!Ref DeploymentRuntimeJson, ""]
                - Fn::Equals: [!Ref DeploymentGitHubSecretArns, ""]
            - Fn::And:
                - Fn::Not: [!Equals [!Ref DeploymentRuntimeJson, ""]]
                - Fn::Not: [!Equals [!Ref DeploymentGitHubSecretArns, ""]]
        AssertDescription: >-
          Deployment runtime JSON and GitHub secret ARNs must be either both empty or
          both non-empty. Target configuration without a readable token would resolve
          no commit while presenting as configured.
  M1AssessmentRegionMatchesModelProfile:
    RuleCondition: !Not [!Equals [!Ref M1AssessmentRuntimeJson, ""]]
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", us-east-1]
        AssertDescription: >-
          Live M1 deployment Region must match the approved Assessment Model Profile Region.

Conditions:
  M1LiveAssessmentEnabled: !Not [!Equals [!Ref M1AssessmentRuntimeJson, ""]]
  DeploymentCommitResolutionEnabled: !Not [!Equals [!Ref DeploymentRuntimeJson, ""]]
  PolicyAuthoringEnabled: !Not [!Equals [!Ref PolicyAuthoringModelProfileJson, ""]]

Resources:
  MetadataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-metadata"
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: metadata

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-artifacts-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: artifacts

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  ArtifactAuditLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-audit-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: artifact-audit

  ArtifactAuditLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref ArtifactAuditLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudTrailGetBucketAcl
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt ArtifactAuditLogBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${ProjectName}-${Environment}-artifact-access"
          - Sid: AllowCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${ArtifactAuditLogBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${ProjectName}-${Environment}-artifact-access"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactAuditLogBucket.Arn
              - !Sub "${ArtifactAuditLogBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  ArtifactAccessTrail:
    Type: AWS::CloudTrail::Trail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: ArtifactAuditLogBucketPolicy
    Properties:
      TrailName: !Sub "${ProjectName}-${Environment}-artifact-access"
      S3BucketName: !Ref ArtifactAuditLogBucket
      EnableLogFileValidation: true
      IncludeGlobalServiceEvents: false
      IsLogging: true
      IsMultiRegionTrail: false
      EventSelectors:
        - IncludeManagementEvents: false
          ReadWriteType: All
          DataResources:
            - Type: AWS::S3::Object
              Values:
                - !Sub "${ArtifactBucket.Arn}/"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: artifact-access-audit

  AssessmentDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${Environment}-assessment-dlq"
      MessageRetentionPeriod: 1209600
  RemediationDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${Environment}-remediation-dlq"
      MessageRetentionPeriod: 1209600
  DeploymentDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${Environment}-deployment-dlq"
      MessageRetentionPeriod: 1209600
  AssessmentQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${Environment}-assessment"
      VisibilityTimeout: 960
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AssessmentDlq.Arn
        maxReceiveCount: 3
  RemediationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${Environment}-remediation"
      VisibilityTimeout: 960
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RemediationDlq.Arn
        maxReceiveCount: 3
  DeploymentQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${Environment}-deployment"
      VisibilityTimeout: 960
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeploymentDlq.Arn
        maxReceiveCount: 3
  # 정책 후보 추출은 Assessment/Remediation/Deployment와 **다른 큐**를 쓴다. 같은 큐를 나눠 쓰면
  # authoring worker의 권한이 다른 Worker의 메시지에도 닿는다.
  PolicyAuthoringDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${Environment}-policy-authoring-dlq"
      MessageRetentionPeriod: 1209600
  PolicyAuthoringQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${Environment}-policy-authoring"
      VisibilityTimeout: 960
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PolicyAuthoringDlq.Arn
        maxReceiveCount: 3
  # DLQ에 메시지가 하나라도 남으면 그 고객의 정책은 후보가 만들어지지 않은 채로 남는다. 그것은
  # "위반 없음"이 아니라 "아직 검토할 것이 없다"로 보이므로 조용히 지나가면 안 된다.
  PolicyAuthoringDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-policy-authoring-dlq"
      AlarmDescription: >-
        A policy candidate extraction exhausted its retries. The customer's uploaded policy has
        no reviewable candidates until this is resolved.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt PolicyAuthoringDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ApiRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-api-runtime"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MetadataAndWorkflowDispatch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # `TransactWriteItems`(POST /assessments·remediation 등 원자적 다중 write)는
                # 하위 item action과 별개로 `dynamodb:TransactWriteItems` action을 요구한다.
                # 이 action이 없으면 트랜잭션이 AccessDenied로 거부되어 POST /assessments가
                # 503을 낸다(라이브에서 확인).
                Action:
                  [
                    "dynamodb:GetItem",
                    "dynamodb:PutItem",
                    "dynamodb:Query",
                    "dynamodb:UpdateItem",
                    "dynamodb:DeleteItem",
                    "dynamodb:TransactWriteItems",
                    "dynamodb:ConditionCheckItem",
                  ]
                Resource:
                  - !GetAtt MetadataTable.Arn
                  - !Sub "${MetadataTable.Arn}/index/*"
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  - !GetAtt AssessmentQueue.Arn
                  - !GetAtt RemediationQueue.Arn
                  - !GetAtt DeploymentQueue.Arn
                  # 후보 추출 요청만 보낸다. API는 정규화 artifact를 직접 읽지 않는다 —
                  # 그 권한은 Authoring Worker에만 있다.
                  - !GetAtt PolicyAuthoringQueue.Arn
              # 고객 정책 원문 업로드 세션: presigned put 발급, finalize 시 원문 read,
              # 정규화 산출물 write. tenant-scoped customers/* prefix로만 제한한다.
              - Effect: Allow
                Action: ["s3:PutObject", "s3:GetObject"]
                Resource: !Sub "${ArtifactBucket.Arn}/customers/*"
              # 미승인 정책 문서 삭제(DELETE /policy-sources/{id}/versions/{ver}). 정책 원문
              # prefix로만 제한한다.
              - Effect: Allow
                Action: s3:DeleteObject
                Resource: !Sub "${ArtifactBucket.Arn}/customers/*/policy-sources/*"
              # Admin 사용자 관리(POST/GET /admin/users, profile 지정)와 Parent orchestrate가
              # 쓰는 Bedrock. 사용자 관리는 이 UserPool로만, Bedrock은 승인된 Parent 모델로만.
              - Effect: Allow
                Action:
                  [
                    "cognito-idp:AdminCreateUser",
                    "cognito-idp:AdminAddUserToGroup",
                    "cognito-idp:AdminSetUserPassword",
                    "cognito-idp:AdminUpdateUserAttributes",
                    "cognito-idp:ListUsers",
                  ]
                Resource: !GetAtt UserPool.Arn
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0"
              - Effect: Allow
                Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: "*"
        # 빈 IAM policy는 만들지 않는다(IAM이 거부한다). 미설정 배포에서는 API가 GitHub를
        # 전혀 읽지 않으므로 이 정책 자체가 없어야 한다.
        - !If
          - DeploymentCommitResolutionEnabled
          - PolicyName: DeploymentCommitResolutionGitHubToken
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Split [",", !Ref DeploymentGitHubSecretArns]
          - !Ref AWS::NoValue
  WorkflowRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-workflow-runtime"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WorkflowStateAndDispatch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["dynamodb:GetItem", "dynamodb:PutItem", "dynamodb:Query", "dynamodb:UpdateItem"]
                Resource:
                  - !GetAtt MetadataTable.Arn
                  - !Sub "${MetadataTable.Arn}/index/*"
              - Effect: Allow
                Action: ["sqs:ReceiveMessage", "sqs:DeleteMessage", "sqs:GetQueueAttributes", "sqs:SendMessage"]
                Resource:
                  - !GetAtt AssessmentQueue.Arn
                  - !GetAtt RemediationQueue.Arn
                  - !GetAtt DeploymentQueue.Arn
              - Effect: Allow
                Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: "*"
        # Do not create an empty IAM policy in fixture mode: IAM rejects an empty
        # Statement array before the foundation can be deployed.
        - !If
          - M1LiveAssessmentEnabled
          - PolicyName: M1ReadOnlyAssessmentInputs
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Split [",", !Ref M1AssessmentSecretArns]
                - Effect: Allow
                  Action: sts:AssumeRole
                  Resource: !Split [",", !Ref M1AssessmentReadRoleArns]
                - Effect: Allow
                  Action: bedrock:InvokeModel
                  Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0"
          - !Ref AWS::NoValue
        # Deployment Worker의 live 경로는 승인 repository의 GitHub token을 읽는다. 미설정
        # 배포에서는 Worker가 설정 오류로 먼저 멈추므로 이 정책 자체가 없어야 한다.
        - !If
          - DeploymentCommitResolutionEnabled
          - PolicyName: DeploymentWorkerGitHubToken
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Split [",", !Ref DeploymentGitHubSecretArns]
          - !Ref AWS::NoValue

  # Authoring 전용 Role. Assessment Worker와 권한을 분리한다 — 정책 원문을 읽는 권한과 고객
  # AWS 계정을 읽는 권한이 같은 Role에 있으면, 한쪽의 사고가 다른 쪽 자료까지 닿는다.
  PolicyAuthoringRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-policy-authoring-runtime"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PolicyAuthoringStateAndArtifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  ["dynamodb:GetItem", "dynamodb:PutItem", "dynamodb:Query", "dynamodb:UpdateItem"]
                Resource:
                  - !GetAtt MetadataTable.Arn
                  - !Sub "${MetadataTable.Arn}/index/*"
              # 정규화 artifact **읽기 전용**. write는 정규화 단계(API runtime)의 책임이며,
              # 추출 worker가 원문을 고쳐 쓸 수 있으면 승인된 판본과 읽은 판본이 달라질 수 있다.
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ArtifactBucket.Arn}/customers/*"
              - Effect: Allow
                Action: ["sqs:ReceiveMessage", "sqs:DeleteMessage", "sqs:GetQueueAttributes"]
                Resource: !GetAtt PolicyAuthoringQueue.Arn
              - Effect: Allow
                Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: "*"
        # 승인된 authoring 모델이 설정되지 않은 배포에서는 Bedrock 권한 자체를 만들지 않는다.
        - !If
          - PolicyAuthoringEnabled
          - PolicyName: PolicyAuthoringApprovedModel
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: bedrock:InvokeModel
                  Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0"
          - !Ref AWS::NoValue

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${ProjectName}-${Environment}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      # Backend identity 경계(apps.backend.auth.principal)는 access token에 non-empty
      # custom:customer_id claim을 요구한다. 이 커스텀 속성은 관리자만 설정하며 caller가
      # 조작할 수 없는 tenant 식별자다. Cognito는 커스텀 속성을 access token에 기본으로
      # 넣지 않으므로 아래 PreTokenGeneration 트리거가 발급 시점에 이 값을 복사한다.
      Schema:
        - Name: customer_id
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: "1"
            MaxLength: "128"
      # V2 트리거만 access token claim 주입을 지원한다(V1은 ID token만).
      LambdaConfig:
        PreTokenGenerationConfig:
          LambdaVersion: V2_0
          LambdaArn: !GetAtt PreTokenGenerationFunction.Arn
  AdminUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admin
      UserPoolId: !Ref UserPool
  StandardUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: User
      UserPoolId: !Ref UserPool
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${ProjectName}-${Environment}-${AWS::AccountId}"
      UserPoolId: !Ref UserPool
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${ProjectName}-${Environment}-api"
      GenerateSecret: false
      # ALLOW_USER_PASSWORD_AUTH는 E2E/CLI에서 initiate-auth로 토큰을 직접 발급받기 위한
      # 것이다. 브라우저 OAuth PKCE 흐름에는 필요 없으므로 운영 배포에서는 제거를 고려한다.
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_PASSWORD_AUTH]
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      CallbackURLs: [!Ref FrontendCallbackUrl]
      LogoutURLs: [!Ref FrontendLogoutUrl]
      SupportedIdentityProviders: [COGNITO]

  # Cognito Pre-Token-Generation V2 트리거: 저장된 custom:customer_id를 access token에
  # 복사한다. 속성이 없거나 비면 fail-closed로 token을 수정하지 않고, Backend가 그 token을
  # 거부한다. tenant claim은 관리자 설정 속성에서만 나오며 caller가 조작할 수 없다.
  PreTokenGenerationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-pretoken"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: "*"

  PreTokenGenerationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-pretoken"
      Runtime: python3.12
      Handler: apps.backend.auth.pre_token_generation.lambda_handler
      Role: !GetAtt PreTokenGenerationRole.Arn
      Timeout: 5
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
        S3ObjectVersion: !Ref LambdaCodeS3ObjectVersion

  AllowCognitoInvokePreTokenGeneration:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreTokenGenerationFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # LangGraph and its runtime dependencies for the Parent Orchestrator and workflow
  # subgraphs (ADR-0012). Kept in a Layer so the function ZIP stays first-party and
  # deterministic; the plan_hash boundary (Terraform show-json only) is unaffected.
  LangGraphLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub "${ProjectName}-${Environment}-langgraph"
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]
      Content:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LangGraphLayerS3Key
        S3ObjectVersion: !Ref LangGraphLayerS3ObjectVersion

  ApiRuntimeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-api"
      Runtime: python3.12
      Handler: apps.backend.api.runtime.lambda_handler
      Role: !GetAtt ApiRuntimeRole.Arn
      Timeout: 30
      Layers: [!Ref LangGraphLayer]
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
        S3ObjectVersion: !Ref LambdaCodeS3ObjectVersion
      Environment:
        Variables:
          METADATA_TABLE_NAME: !Ref MetadataTable
          ASSESSMENT_QUEUE_URL: !Ref AssessmentQueue
          REMEDIATION_QUEUE_URL: !Ref RemediationQueue
          DEPLOYMENT_QUEUE_URL: !Ref DeploymentQueue
          ASSESSMENT_SCOPE_JSON: !Ref AssessmentScopeJson
          POLICY_SOURCE_BUCKET_NAME: !Ref ArtifactBucket
          POLICY_AUTHORING_QUEUE_URL: !Ref PolicyAuthoringQueue
          # Admin 사용자 관리(POST/GET /admin/users, profile 지정)가 대상으로 삼는 UserPool.
          USER_POOL_ID: !Ref UserPool
          # 승인된 배포 대상의 GitHub 좌표. Deployment 생성이 TERRAFORM_PATCH의 merge commit을
          # 해석하려면 필요하다(ADR-0019 §3·§4). 비어 있으면 그 경로만 fail-closed되고,
          # ACTUAL_SYNC 배포는 GitHub read 없이 그대로 동작한다.
          DEPLOYMENT_RUNTIME_JSON: !Ref DeploymentRuntimeJson

  OutboxSweeperFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-outbox-sweeper"
      Runtime: python3.12
      Handler: apps.backend.api.runtime.outbox_sweeper_handler
      Role: !GetAtt ApiRuntimeRole.Arn
      Timeout: 30
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
        S3ObjectVersion: !Ref LambdaCodeS3ObjectVersion
      Environment:
        Variables:
          METADATA_TABLE_NAME: !Ref MetadataTable
          # Sweeper drains every workflow command from the shared Outbox, so it needs
          # each queue to route Assessment/Remediation/Deployment tasks correctly.
          ASSESSMENT_QUEUE_URL: !Ref AssessmentQueue
          REMEDIATION_QUEUE_URL: !Ref RemediationQueue
          DEPLOYMENT_QUEUE_URL: !Ref DeploymentQueue

  ApplyCompletionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-apply-completion"
      Runtime: python3.12
      Handler: apps.backend.api.runtime.apply_completion_handler
      Role: !GetAtt ApiRuntimeRole.Arn
      Timeout: 30
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
        S3ObjectVersion: !Ref LambdaCodeS3ObjectVersion
      Environment:
        Variables:
          METADATA_TABLE_NAME: !Ref MetadataTable
          # 완료 Event 처리는 `APPLY_COMPLETED` task를 이 큐에 넣어 D Worker를 깨운다.
          DEPLOYMENT_QUEUE_URL: !Ref DeploymentQueue

  AssessmentWorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-assessment-worker"
      Runtime: python3.12
      Handler: apps.backend.assessment.runtime.lambda_handler
      Role: !GetAtt WorkflowRuntimeRole.Arn
      Timeout: 900
      Layers: [!Ref LangGraphLayer]
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
        S3ObjectVersion: !Ref LambdaCodeS3ObjectVersion
      Environment:
        Variables:
          METADATA_TABLE_NAME: !Ref MetadataTable
          M0_SYNTHETIC_ASSESSMENT: "true"
          M1_ASSESSMENT_RUNTIME_JSON: !Ref M1AssessmentRuntimeJson
  AssessmentQueueEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt AssessmentQueue.Arn
      FunctionName: !Ref AssessmentWorkerFunction
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]

  # Policy Authoring Worker. 고객 정책 원문에서 Rule 후보를 만드는 유일한 실행체이며, 별도의
  # Role과 별도의 큐를 쓴다.
  PolicyAuthoringWorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-policy-authoring-worker"
      Runtime: python3.12
      Handler: apps.backend.policy.authoring.runtime.lambda_handler
      Role: !GetAtt PolicyAuthoringRuntimeRole.Arn
      Timeout: 900
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
        S3ObjectVersion: !Ref LambdaCodeS3ObjectVersion
      Environment:
        Variables:
          METADATA_TABLE_NAME: !Ref MetadataTable
          POLICY_SOURCE_BUCKET_NAME: !Ref ArtifactBucket
          POLICY_AUTHORING_MODEL_PROFILE_JSON: !Ref PolicyAuthoringModelProfileJson
  PolicyAuthoringQueueEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt PolicyAuthoringQueue.Arn
      FunctionName: !Ref PolicyAuthoringWorkerFunction
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]

  # Remediation/Deployment Worker는 코드만 있고 이 스택에 실행체가 없었다. 큐에 task가 쌓여도
  # 소비자가 없으면 재시도만 반복하다 DLQ로 간다.
  RemediationWorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-remediation-worker"
      Runtime: python3.12
      Handler: apps.backend.remediation.runtime.lambda_handler
      Role: !GetAtt WorkflowRuntimeRole.Arn
      Timeout: 900
      Layers: [!Ref LangGraphLayer]
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
        S3ObjectVersion: !Ref LambdaCodeS3ObjectVersion
      Environment:
        Variables:
          METADATA_TABLE_NAME: !Ref MetadataTable
          # TERRAFORM_PATCH의 PR write는 Deployment와 같은 승인 repository·GitHub token scope를
          # 쓴다(ADR-0019 §6). 비어 있으면 patch 경로가 fail-closed하고 ACTUAL_SYNC만 동작한다.
          DEPLOYMENT_RUNTIME_JSON: !Ref DeploymentRuntimeJson
  RemediationQueueEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt RemediationQueue.Arn
      FunctionName: !Ref RemediationWorkerFunction
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]

  DeploymentWorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-deployment-worker"
      Runtime: python3.12
      Handler: apps.backend.deployment.runtime.lambda_handler
      Role: !GetAtt WorkflowRuntimeRole.Arn
      Timeout: 900
      Layers: [!Ref LangGraphLayer]
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
        S3ObjectVersion: !Ref LambdaCodeS3ObjectVersion
      Environment:
        Variables:
          METADATA_TABLE_NAME: !Ref MetadataTable
          # 승인된 배포 대상. 비어 있으면 Worker가 fail-closed로 멈춘다(ADR-0019).
          DEPLOYMENT_RUNTIME_JSON: !Ref DeploymentRuntimeJson
          # apply 확정 뒤 Post-Deploy Verification Assessment task를 Assessment Queue로 보낸다
          # (ADR-0020 §7). WorkflowRuntimeRole이 이미 이 큐에 SendMessage를 갖는다.
          ASSESSMENT_QUEUE_URL: !Ref AssessmentQueue
  DeploymentQueueEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt DeploymentQueue.Arn
      FunctionName: !Ref DeploymentWorkerFunction
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]

  OutboxSweepSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Arn: !GetAtt OutboxSweeperFunction.Arn
          Id: OutboxSweeper
  AllowEventBridgeOutboxSweep:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OutboxSweeperFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt OutboxSweepSchedule.Arn

  # Apply run 완료 Event → 재조회 좌표 예약 (ADR-0019 §7). Event는 신호이므로 A는 좌표만
  # 저장하고, conclusion 같은 사실은 D Worker가 run을 재조회해 확정한다. GitHub Actions에는
  # DynamoDB write 권한을 주지 않는다 — 이 Lambda가 유일한 write 경로다.
  ApplyCompletionRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Reserve the verification coordinate for a completed Terraform apply run.
      State: ENABLED
      EventPattern:
        source:
          - !Sub "${ProjectName}.${Environment}.deployment"
        detail-type:
          - terraform-apply-completed
      Targets:
        - Arn: !GetAtt ApplyCompletionFunction.Arn
          Id: ApplyCompletion
  AllowEventBridgeApplyCompletion:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApplyCompletionFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ApplyCompletionRule.Arn

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-api"
      ProtocolType: HTTP
      # Browser calls come from the SPA origin, which is cross-origin to this API. Without CORS the
      # browser blocks every request at the preflight (OPTIONS) with no response. Origins are the
      # exact SPA callback URL and localhost for local development; credentials are not used because
      # the SPA sends a Bearer token, not cookies.
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendCallbackUrl
          - http://localhost:5173
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        AllowCredentials: false
        MaxAge: 300
  HttpApiAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      IdentitySource: [$request.header.Authorization]
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
      Name: CognitoJwt
  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiRuntimeFunction.Arn
      PayloadFormatVersion: "2.0"
  PostAssessmentsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /assessments"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  # Natural-language entry to the Parent Orchestrator (ADR-0012). The Parent only
  # classifies and proposes; it starts no workflow, so this route returns a decision.
  PostOrchestrateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /orchestrate"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  # Admin console: policy document list/delete, assessment scope, and user management.
  GetPolicySourcesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /policy-sources"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  DeletePolicySourceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "DELETE /policy-sources/{sourceId}/versions/{version}"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  GetScopeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /scope"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  GetAdminUsersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /admin/users"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  PostAdminUsersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /admin/users"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  PostAdminUserProfileRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /admin/users/profile"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  GetJobsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /jobs/{jobId}"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  GetAssessmentReportRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /assessments/{assessmentId}"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  # 고객 정책 원문 업로드 세션 라우트(관리자 전용, JWT 인가). 서버가 저장 위치를
  # 발급하므로 client는 source_id/version/bucket/key를 고를 수 없다.
  PostPolicySourceUploadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /policy-sources/uploads"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  GetPolicySourceStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /policy-sources/{sourceId}/versions/{version}"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  PostPolicySourceProcessRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /policy-sources/{sourceId}/versions/{version}/process"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  # 검토된 Source/Rule version 승인과 승인된 Rule의 Policy Profile 게시(관리자 전용, JWT 인가).
  PostPolicySourceApproveRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /policy-sources/{sourceId}/versions/{version}/approve"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  # 후보 추출 요청(202)과 검토용 후보 조회. 응답에는 정규화 문서의 원문이 들어가지 않는다 —
  # 리뷰어가 보는 문장은 모델이 쓴 재진술이다.
  PostPolicySourceCandidatesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /policy-sources/{sourceId}/versions/{version}/candidates"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  GetPolicySourceCandidatesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /policy-sources/{sourceId}/versions/{version}/candidates"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  PostPolicyProfilesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /policy-profiles"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  # 고객 Remediation 예외 등록(관리자 전용, JWT 인가). 예외는 반드시 만료되며
  # (customer_id, rule_id, rule_version)에 묶인다.
  PostRemediationExceptionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /remediation-exceptions"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  # 조치 흐름의 진입점(ADR-0018). handler branch만 있고 이 route가 없으면 고객은 조치를
  # 시작할 수 없다 — API Gateway는 명시적 allow-list이므로 선언되지 않은 경로는 handler에
  # 닿기 전에 404다.
  PostFindingRemediationsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /findings/{findingId}/remediations"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  # M3 deployment routes. API Gateway is an explicit allow-list; handler routes
  # alone are not reachable from the customer-facing HTTP API.
  PostRemediationDeploymentsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /remediations/{remediationId}/deployments"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  GetDeploymentRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /deployments/{deploymentId}"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  GetDeploymentVerificationRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /deployments/{deploymentId}/verification"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  PostDeploymentRejectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /deployments/{deploymentId}/reject"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  # 사람 승인 게이트(ADR-0019 §4). 승인은 apply를 트리거하지 않고 승인 record와 dispatch
  # outbox만 쓰지만, 이 route가 없으면 폐루프가 승인 단계에서 멈춘다.
  PostDeploymentApproveRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /deployments/{deploymentId}/approve"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  # M4 A 관측·비용 조회(Admin 전용, ADR-0021 §3). live metric source가 주입되지 않은
  # 배포에서는 handler가 404로 답하며, 그것이 "주입할 source가 없다"의 표현이다.
  GetDeploymentObservabilityRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /deployments/{deploymentId}/observability"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  GetAuditEventsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /audit-events"
      AuthorizationType: JWT
      AuthorizerId: !Ref HttpApiAuthorizer
      Target: !Join ["/", [integrations, !Ref HttpApiIntegration]]
  HttpApiDefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true
  AllowHttpApiInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiRuntimeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

Outputs:
  MetadataTableName:
    Description: Name injected into Backend DynamoDB adapters.
    Value: !Ref MetadataTable
  MetadataTableArn:
    Description: ARN used by least-privilege IAM and integration consumers.
    Value: !GetAtt MetadataTable.Arn
  ArtifactBucketName:
    Description: Name injected into Backend S3 artifact adapters.
    Value: !Ref ArtifactBucket
  ArtifactBucketArn:
    Description: ARN used by least-privilege IAM and integration consumers.
    Value: !GetAtt ArtifactBucket.Arn
  ArtifactAuditLogBucketName:
    Description: Name of the retained CloudTrail artifact-access audit destination.
    Value: !Ref ArtifactAuditLogBucket
  ArtifactAccessTrailArn:
    Description: ARN of the trail recording ArtifactBucket S3 data events.
    Value: !GetAtt ArtifactAccessTrail.Arn
  PolicyAuthoringQueueUrl:
    Value: !Ref PolicyAuthoringQueue
  AssessmentQueueUrl:
    Value: !Ref AssessmentQueue
  RemediationQueueUrl:
    Value: !Ref RemediationQueue
  DeploymentQueueUrl:
    Value: !Ref DeploymentQueue
  HttpApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoHostedUiDomain:
    Description: Cognito Hosted UI domain used by the browser OAuth PKCE flow.
    Value: !Sub "${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
